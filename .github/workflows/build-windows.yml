name: Build Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm config set registry https://registry.npmmirror.com
          npm ci || npm install --no-audit --no-fund
          npm run build

      - name: Build backend engine (PyInstaller onedir)
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --onedir --noconsole --name SecondBrain-backend server_entry.py
          --paths .
          --add-data "../frontend/dist;frontend_dist"
          --hidden-import uvicorn.logging
          --hidden-import uvicorn.loops.auto
          --hidden-import uvicorn.protocols.http.auto
          --hidden-import uvicorn.protocols.websockets.auto
          --hidden-import uvicorn.lifespan.on
          --collect-all chromadb
          --collect-all tokenizers
          --collect-all onnxruntime
          --collect-all rapidocr_onnxruntime
          --collect-all trafilatura
          --hidden-import app.main
          --hidden-import app.rag
          --hidden-import app.cards

      - name: Build Electron shell
        working-directory: electron
        run: |
          npm ci || npm install --no-audit --no-fund
          npx electron-builder --win dir

      - name: Assemble portable package
        shell: pwsh
        run: |
          $root = "package/MemoryAI"
          New-Item -ItemType Directory -Force -Path "$root/resources/backend", "$root/知识库文件夹/默认知识库" | Out-Null
          # Electron壳
          Copy-Item electron/out/win-unpacked/* $root -Recurse -Force
          # 后端引擎
          Copy-Item backend/dist/SecondBrain-backend/* "$root/resources/backend/" -Recurse -Force
          Copy-Item README.md $root/
          Compress-Archive -Path package/* -DestinationPath SecondBrain-Windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecondBrain-Windows-x64
          path: SecondBrain-Windows-x64.zip
